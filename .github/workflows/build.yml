name: Build PlatformIO

# 1. Quando deve partire la pipeline?
on:
  push:
    branches: [ "main", "master" ] # Modifica se il tuo branch principale ha un altro nome
  pull_request:
    branches: [ "main", "master" ]

# 2. Cosa deve fare?
jobs:
  build:
    runs-on: ubuntu-latest # Usa un server Linux fresco di fabbrica

    steps:
    # A. Scarica il codice dal tuo repository
    - name: Checkout del codice
      uses: actions/checkout@v4

    # B. Prepara l'ambiente installando Python (necessario per PlatformIO)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # C. Installa il motore di compilazione (PlatformIO)
    - name: Installa PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    # D. Compila il firmware! (Equivale a cliccare "Verifica" sull'IDE)
    - name: Compila il firmware
      run: pio run