name: Build PlatformIO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # A. Scarica il codice
    - name: Checkout del codice
      uses: actions/checkout@v4

    # B. Prepara l'ambiente Python e PlatformIO
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Installa PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    # C. Analisi Statica con Cppcheck
    - name: Installa Cppcheck e Analizza il codice
      run: |
        # 1. Installa lo strumento sul server Linux
        sudo apt-get update
        sudo apt-get install -y cppcheck
        # 2. Esegue l'analisi solo sulla cartella 'src' (dove sta il tuo codice C++)
        # --enable=all cerca tutti i tipi di problemi (style, performance, warning)
        # --error-exitcode=1 fa fallire la pipeline se trova errori gravi
        cppcheck --enable=all --error-exitcode=1 src/

    # D. Compila il firmware (viene eseguito solo se Cppcheck non trova errori critici)
    - name: Compila il firmware
      run: pio run